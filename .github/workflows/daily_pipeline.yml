name: Janus Daily Pipeline

on:
  schedule:
    # Mon-Fri @ 14:13 UTC (~7:43 PM IST) -- odd minute deliberately, to
    # avoid the top-of-hour bottleneck on shared GitHub Actions runners.
    - cron: '13 14 * * 1-5'
  workflow_dispatch: {}  # allows manual trigger from the Actions tab for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python live_pipeline.py

      - name: Commit updated state and data back to repo
        run: |
          git config --global user.name "janus-bot"
          git config --global user.email "janus-bot@users.noreply.github.com"
          git add state/paper_portfolio_state.json NSE_EQ_Master_Raw.parquet
          git diff --staged --quiet || git commit -m "Daily pipeline run: $(date -u +'%Y-%m-%d')"
          git push

      - name: Upload run log as artifact (kept even if commit/push fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: state/paper_portfolio_state.json
          retention-days: 90
